; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = waveshare_s3_lcd169
name = LoriiniSensor
description = Loriini Sensor

[env]
; pioarduino platform: Arduino-ESP32 core 3.x (the Waveshare demos need >= 3.0.5)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
extra_scripts =
	pre:buildscript_versioning.py
lib_compat_mode = strict
lib_ldf_mode = chain
lib_deps =
	ESP32Async/AsyncTCP@^3.5.0
	ESP32Async/ESPAsyncWebServer@^3.12.1
	jsc/ArduinoLog@^1.2.1
	bblanchon/ArduinoJson@^7.4.3
	bblanchon/StreamUtils@^1.9.2
	https://github.com/softt-io/ElegantOTA-Pro.git
	moononournation/GFX Library for Arduino@^1.6.5
build_flags =
	-D CORE_DEBUG_LEVEL=3
	-D ELEGANTOTA_USE_ASYNC_WEBSERVER=1

; Waveshare ESP32-S3-Touch-LCD-1.69: ESP32-S3R8 (8MB octal PSRAM), 16MB quad flash, native USB.
; https://docs.waveshare.com/ESP32-S3-Touch-LCD-1.69
; default_16MB.csv gives two 6.25MB OTA app slots.
[env:waveshare_s3_lcd169]
board = esp32-s3-devkitc1-n16r8
board_build.partitions = default_16MB.csv
monitor_rts = 0
monitor_dtr = 0
build_flags = ${env.build_flags}
	-D WAVESHARE_ESP32S3_TOUCH_LCD_169
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
